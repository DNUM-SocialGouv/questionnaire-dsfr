// Ne jamais utiliser cette lecture pour autoriser ou refuser un envoi :
// l'unicité reste imposée par la règle ACL sur AddRecord.
async function checkExistingParticipation(){
  if(!participationCheckPromise){
    participationCheckPromise=(async()=>{
      try{
        // Une synthèse Grist de Resultats groupée par Compte_id et Annee
        // porte un identifiant automatique (non renommable dans Grist).
        const tableIds=await grist.docApi.listTables();
        const isStatusSummary=name=>name.startsWith('Resultats_summary_')
          &&name.includes('Compte_id')&&name.includes('Annee');
        const tableId=tableIds.find(isStatusSummary);
        if(!tableId)throw new Error('Synthèse des participations absente');
        const participation=await grist.docApi.fetchTable(tableId);
        if(!Array.isArray(participation.Annee))throw new Error('Année indisponible');
        // Les ACL filtrent les lignes de cette synthèse sur user.UserID.
        // Tester avec un agent éditeur : les propriétaires voient toutes les lignes.
        alreadyParticipated=participation.Annee.some(year=>Number(year)===campaignYear);
      }catch(e){
        // Défaut de lecture : ne pas prétendre que l'agent n'a jamais répondu.
        // On conserve le contrôle serveur lors de l'enregistrement.
        participationCheckFailed=true;
      }
    })();
  }
  return participationCheckPromise;
}

let transitionToken=0;
function go(n){
  if(alreadyParticipated && n<=qs.length){step=qs.length+1;render();return;}
  if(n===0 && !window.currentQuestions){alert('Les questions sont en cours de chargement.');return;}
  if(step>=0&&step<qs.length&&n>step&&isRequired(window.currentQuestions?.[step]||{})&&isEmpty(answers[step])){alert('Cette question est obligatoire.');return;}
  const token=++transitionToken;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shouldStartAtTop=(step===-1 && n===0) || n===qs.length || n===qs.length+1;
  const showScreen=()=>{step=n;render();if(shouldStartAtTop){requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'instant'}));}};
  if(reduced){showScreen();return;}
  // Passage en deux temps, sans scroll commandé : la question suivante arrive par fondu.
  panel.style.transition='opacity 160ms ease-in';
  panel.style.opacity='0.16';
  window.setTimeout(()=>{
    if(token!==transitionToken)return;
    showScreen();
    // Ne fait aucun scroll entre les questions; évite également l'ancrage automatique du navigateur.
    panel.style.transition='none';
    panel.style.opacity='0.16';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(token!==transitionToken)return;
      panel.style.transition='opacity 360ms cubic-bezier(.22,1,.36,1)';
      panel.style.opacity='1';
    }));
  },165);
}

let submissionInProgress=false;
const campaignYear=Number(new URLSearchParams(location.search).get('annee')||2026);
const validCodes=Array.from({length:9},(_,i)=>'Q'+String(i+1).padStart(2,'0')).concat('Q10_commentaire');
function isRequired(row){return row.Obligatoire===true || row.Obligatoire===1 || row.Obligatoire==='true';}
function isEmpty(value){return value===null || value===undefined || String(value).trim()==='';}
function questionIsText(index){return window.currentQuestions?.[index]?.Type_reponse==='texte_court';}
async function submitTest(){
 if(submissionInProgress)return;
 const rows=window.currentQuestions;
 if(!rows || rows.length!==qs.length){alert('Les questions ne sont pas chargées. Aucun envoi effectué.');return;}
 if(rows.some(r=>!validCodes.includes(r.Code)) || new Set(rows.map(r=>r.Code)).size!==rows.length){alert('Configuration des codes de question invalide. Aucun envoi effectué.');return;}
 const missing=rows.findIndex((r,i)=>isRequired(r)&&isEmpty(answers[i]));
 if(missing>=0){alert('Veuillez répondre à la question obligatoire '+(missing+1)+'.');go(missing);return;}
 if(answers.every(isEmpty)){alert('Répondez au moins à une question avant l’envoi.');return;}
 const fields=Object.fromEntries(validCodes.map(code=>[code,code==='Q10_commentaire'?'':null]));fields.Annee=campaignYear;
 rows.forEach((r,i)=>{if(isEmpty(answers[i]))return;if(r.Type_reponse==='texte_court'){const value=String(answers[i]).trim();if(value.length>Number(r.Max_caracteres||100))throw new Error('Réponse trop longue');fields[r.Code]=value;}else if(r.Type_reponse==='choix_unique'){const index=choices.indexOf(answers[i]);if(index<0)throw new Error('Réponse invalide');fields[r.Code]=index===4?0:4-index;}else throw new Error('Type de question inconnu');});
 submissionInProgress=true;
 const buttons=[...panel.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
 const message=document.createElement('p');message.className='hint';message.setAttribute('role','status');message.textContent='Envoi en cours…';panel.append(message);
 try{
  if(typeof grist==='undefined'||!grist.docApi)throw new Error('Connexion indisponible.');
  await grist.docApi.applyUserActions([['AddRecord','Resultats',null,fields]]);
  go(qs.length+1);
 }catch(error){
  const refusal=String(error.message||error);
  if(refusal.includes('DEJA_PARTICIPE')){alreadyParticipated=true;go(qs.length+1);return;}
  if(refusal.includes('row create access rules')){message.className='fr-alert fr-alert--info fr-mt-3w';message.setAttribute('role','alert');message.innerHTML='<h2 class="fr-alert__title">Une participation par campagne</h2><p>Votre contribution n’a pas été envoyée. Si vous avez déjà répondu à cette édition, votre première contribution est conservée.</p>';return;}
  message.textContent='L’enregistrement n’a pas pu être confirmé. Ne renvoyez pas vos réponses avant vérification de la table Résultats.';
 }finally{submissionInProgress=false;}
}

if(typeof grist!=='undefined'){
 grist.ready({requiredAccess:'full'});
 grist.onRecords(async function(records){

  if(alreadyParticipated){step=qs.length+1;render();return;}
  const rows=(records||[]).filter(r=>r&&String(r.Intitule||'').trim()&&Number(r.Annee)===campaignYear).sort((a,b)=>Number(a.Ordre||0)-Number(b.Ordre||0));
  if(!rows.length){window.currentQuestions=null;panel.innerHTML='<h1 class="fr-h4">Aucune question disponible pour cette édition</h1>';return;}
  const signature=JSON.stringify(rows.map(r=>[r.id,r.Code,r.Intitule,r.Type_reponse,r.Obligatoire,r.Max_caracteres,r.Annee]));
  if(signature!==window.questionSignature){window.questionSignature=signature;window.currentQuestions=rows;qs=rows.map(r=>String(r.Intitule));answers=Array(rows.length).fill(null);step=-1;render();}
 });

  const cards=document.createElement('div');cards.className='next-cards';
  ['Etape_1','Etape_2','Etape_3'].forEach((key,i)=>{const lines=String(editorial[key]||'').split(/\n/);const title=lines.shift();const card=document.createElement('article');card.className='next-card';card.innerHTML='<img width="80" height="80" alt="" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.0/dist/artwork/pictograms/digital/'+['data-visualization','innovation','mail-send'][i]+'.svg"><div><h3>'+esc(title)+'</h3>'+paragraphs(lines.join('\n'))+'</div>';cards.append(card);});panel.append(cards);
 }
 const label=document.querySelector('.survey-title');if(label)label.textContent=editorial.Titre;
 document.querySelector('footer').textContent=editorial.Titre+' — Ministères sociaux';
}
render();
</script></body></html>
