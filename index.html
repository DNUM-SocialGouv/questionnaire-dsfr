body{background:#fff;color:#161616;font-family:Marianne,arial,sans-serif}.shell{max-width:880px;margin:auto;padding:28px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #ddd;padding:20px 0}.brand{font-weight:700;font-size:1.1rem}.tag{font-size:.8rem;color:#666}.panel{background:#fff;min-height:420px;margin-top:12px;padding:24px 0}.kicker{color:#000091;font-weight:700;margin-bottom:12px}.question{font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.3;margin-bottom:30px}.choices{display:grid;gap:12px}.choice{display:flex;align-items:center;gap:15px;text-align:left;padding:18px 20px;border:1px solid #929292;background:#fff;cursor:pointer;font:inherit;min-height:58px}.choice:hover{background:#f5f5fe}.choice[aria-pressed=true]{outline:3px solid #000091;background:#e3e3fd;border-color:#000091}.letter{background:#eeeefa;color:#000091;padding:4px 10px;font-weight:bold}.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap}.progress{display:none}.fill{display:none}.hint{font-size:.88rem;color:#666}.hidden{display:none}textarea{width:100%;min-height:130px;padding:14px;border:1px solid #929292;border-bottom:2px solid #161616;background:#f6f6f6;font:inherit}button:focus-visible,textarea:focus-visible{outline:3px solid #0a76f6;outline-offset:3px}.review{padding-left:20px}.review li{margin-bottom:16px}.review strong{display:block}footer{font-size:.85rem;color:#666;margin-top:25px}@media(prefers-reduced-motion:reduce){.fill{transition:none}}.card-choices{border:0;padding:0;margin:0;display:grid;gap:12px}.card-option{position:relative}.card-option input{position:absolute;width:1px;height:1px;opacity:0}.card-option label{display:flex;align-items:center;gap:16px;border:1px solid #929292;padding:17px 20px;cursor:pointer;min-height:62px;background:#fff}.card-option label:hover{background:#f5f5fe}.card-option input:checked+label{outline:2px solid #000091;background:#e3e3fd;border-color:#000091}.card-option input:focus-visible+label{outline:3px solid #0a76f6;outline-offset:3px}.card-option .letter{min-width:36px;text-align:center;background:#eeeefa;color:#000091;padding:4px 10px;font-weight:bold}@media(max-width:700px){.fr-header__body-row{align-items:flex-start}.fr-header__service-title{font-size:1rem}.fr-header__service-tagline{font-size:.95rem}.fr-header__logo .fr-logo{font-size:.9rem}} 
/* Conserve le bloc-marque officiel sans en redimensionner le logo. */
.fr-header { box-shadow:none; border-bottom:1px solid #ddd; }
.fr-header .fr-container { max-width:880px !important; width:100%; padding-left:20px; padding-right:20px; margin-left:auto; margin-right:auto; }
.fr-header__body-row { display:flex !important; flex-direction:row !important; flex-wrap:nowrap !important; align-items:center !important; justify-content:space-between !important; gap:20px; min-height:145px; }
.fr-header__brand { width:auto !important; flex:0 0 auto; display:block !important; margin:0 !important; }
.fr-header__brand-top { display:block; }
.fr-header__service { margin-left:auto !important; text-align:right !important; flex:0 1 auto; min-width:0; padding:0 !important; }
.fr-header__service-title {font-size:1.15rem;line-height:1.3;margin:0;font-weight:700;}
.fr-header__service-tagline {font-size:1rem;line-height:1.3;margin:0;}
#stepperHost {margin-top:28px;}
.survey-counter {font-size:1rem; font-weight:700; color:#000091;margin:0 0 10px;}
.survey-progress {height:8px; background:#e3e3fd; width:100%; overflow:hidden; margin:0;}
.survey-progress__fill {height:100%; background:#000091; transition:width .2s ease;}
.end-symbol {display:block;width:110px;height:110px;object-fit:contain;margin-bottom:24px;}
@media(max-width:600px){.fr-header__body-row{gap:12px;min-height:110px}.fr-header__service-title{font-size:.95rem}.fr-header__service-tagline{font-size:.85rem}.fr-header__service{max-width:54%}}
@media(prefers-reduced-motion:reduce){.survey-progress__fill{transition:none}}

/* Évite que les styles du header DSFR compact s'appliquent au bloc-marque. */
.fr-header .fr-header__brand, .fr-header .fr-header__brand-top,
.fr-header .fr-header__logo, .fr-header .fr-header__service {
  box-shadow:none !important; border:0 !important; background:transparent !important;
}
.fr-header .fr-header__brand::before, .fr-header .fr-header__brand::after,
.fr-header .fr-header__brand-top::before, .fr-header .fr-header__brand-top::after,
.fr-header .fr-header__service::before, .fr-header .fr-header__service::after {
  box-shadow:none !important; border:0 !important; background:none !important;
}
.fr-header .fr-header__body-row {border:0 !important; box-shadow:none !important}
.fr-header .fr-header__service {border-top:0 !important; border-bottom:0 !important}
.fr-header .fr-header__body {box-shadow:none !important}
.fr-header__brand-top {padding:0 !important}
.fr-header__logo {padding:0 !important}
/* Les questions sont mesurées au chargement : les réponses ne se déplacent plus. */
.survey-question {margin-bottom:30px}
@media(max-width:600px){
 .fr-header .fr-header__body-row {min-height:100px !important;gap:14px}
 .fr-header .fr-header__service {max-width:52%;flex:1 1 auto !important}
}

const qs=["Au fil du temps, mon quotidien numérique s'améliore", "Quand j’ai besoin d’assistance ou de formation je sais où trouver les ressources ou les contacts", "Quand j’ai un besoin ou une difficulté avec mes logiciels ou mon matériel, l’assistance est efficace pour m’aider", "Les outils de travail collaboratif (messagerie instantanée, visioconférence, partage de documents...) sont adaptés à mes besoins", "Les applicatifs métiers que j’utilise sont performants et facilitent mon travail", "Je comprends les exigences de sécurité numérique (accès, mots de passe, protections)", "Les ministères sociaux agissent pour un numérique plus responsable (réemploi des équipements, économie d’énergie...)", "Les outils d’IA mis à ma disposition sont efficaces et utiles pour mon travail", "Si j’ai à exploiter des données, je dispose des bons outils pour le faire", "Pour finir : quelle serait LA PRIORITÉ à améliorer dans votre quotidien numérique en 2027 ?"], choices=["Tout à fait d'accord", "Plutôt d'accord", "Plutôt pas d'accord", "Pas du tout d'accord", "Je ne suis pas concerné(e)"];let step=-1;const answers=Array(qs.length).fill(null),panel=document.getElementById('panel');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(label,handler,secondary=false){let b=document.createElement('button');b.className=secondary?'fr-btn fr-btn--secondary':'fr-btn';b.textContent=label;b.addEventListener('click',handler);return b}
function go(n){step=n;render();window.scrollTo({top:0,behavior:'instant'})}
function stabilizeQuestionHeight(){
  const current=document.querySelector('.survey-question');
  if(!current)return;
  current.style.minHeight='0px';
  const probe=current.cloneNode(false);
  probe.removeAttribute('id');
  probe.style.cssText='position:absolute;visibility:hidden;pointer-events:none;height:auto;min-height:0;margin:0;left:-99999px;top:0;';
  probe.style.width=current.getBoundingClientRect().width+'px';
  document.body.appendChild(probe);
  let tallest=0;
  for(const q of qs){probe.textContent=q;tallest=Math.max(tallest,probe.getBoundingClientRect().height)}
  probe.remove();
  current.style.minHeight=Math.ceil(tallest)+'px';
}
window.addEventListener('resize',()=>{if(step>=0&&step<qs.length)stabilizeQuestionHeight()});

if(step>=0&&step<qs.length){

}
panel.replaceChildren();

if(step<qs.length){panel.innerHTML='<h1 class="question survey-question" id="q">'+esc(qs[step])+'</h1>';stabilizeQuestionHeight();if(step===qs.length-1){const t=document.createElement('textarea');t.maxLength=100;t.value=answers[step]||'';t.setAttribute('aria-labelledby','q');t.addEventListener('input',()=>{answers[step]=t.value;count.textContent=t.value.length+' / 100 caractères'});panel.append(t);const count=document.createElement('p');count.className='hint';count.textContent=t.value.length+' / 100 caractères';panel.append(count)}else{const group=document.createElement('fieldset');group.className='fr-fieldset card-choices';group.setAttribute('aria-labelledby','q');

wrap.querySelector('input').addEventListener('change',()=>{answers[step]=c;go(step+1)});group.append(wrap)});panel.append(group);
const hint=document.createElement('p');hint.className='hint';hint.style.marginTop='20px';hint.textContent='Astuce : touches 1 à 5 pour répondre.';panel.append(hint)}
const actions=document.createElement('div');actions.className='actions';actions.append(btn('Précédent',()=>go(step-1),true));actions.append(btn(step===qs.length-1?'Relire mes réponses':'Passer à la suite',()=>go(step+1)));panel.append(actions);return}
if(step===qs.length){panel.innerHTML='<p class="kicker">Avant de terminer</p><h1 class="question">Relire mes réponses</h1><p>Dans la version finale, la validation sera définitive. Ici, aucun envoi n’est effectué.</p>';const ul=document.createElement('ol');ul.className='review';qs.forEach((q,i)=>{const li=document.createElement('li');li.innerHTML='<strong>'+esc(q)+'</strong>'+esc(answers[i]||'Sans réponse');ul.append(li)});panel.append(ul);const actions=document.createElement('div');actions.className='actions';actions.append(btn('Modifier',()=>go(0),true));actions.append(btn('Terminer la démonstration',()=>go(qs.length+1)));panel.append(actions);return}
